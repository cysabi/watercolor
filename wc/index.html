<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #008;
        color: #fff;
        text-align: center;
      }
      canvas {
        border: 1px solid #333;
      }
      button {
        margin: 10px;
        padding: 8px 16px;
        background: #444;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>WebGL Ping-Pong Brightness</h2>
    <canvas id="canvas" width="512" height="512"></canvas><br />
    <button onclick="toggle()">Pause/Resume</button>

    <script>
      const canvas = document.getElementById("canvas");
      const gl = canvas.getContext("webgl2");

      const vs = `
            attribute vec2 pos;
            varying vec2 uv;
            void main() {
                gl_Position = vec4(pos, 0, 1);
                uv = pos * 0.5 + 0.5;
            }
        `;

      const fs = `
            precision mediump float;
            varying vec2 uv;
            uniform sampler2D tex;

            void main() {
                gl_FragColor = texture2D(tex, uv) + vec4(.01,0,0,0);
            }
        `;

      function createShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
      }

      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl.VERTEX_SHADER, vs));
      gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(program);
      gl.useProgram(program);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW
      );

      const posLoc = gl.getAttribLocation(program, "pos");
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

      function createTexture() {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA,
          canvas.width,
          canvas.height,
          0,
          gl.RGBA,
          gl.UNSIGNED_BYTE,
          null
        );
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      const tex1 = createTexture();
      const tex2 = createTexture();
      const fb1 = gl.createFramebuffer();
      const fb2 = gl.createFramebuffer();

      gl.bindFramebuffer(gl.FRAMEBUFFER, fb1);
      gl.framebufferTexture2D(
        gl.FRAMEBUFFER,
        gl.COLOR_ATTACHMENT0,
        gl.TEXTURE_2D,
        tex1,
        0
      );
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb2);
      gl.framebufferTexture2D(
        gl.FRAMEBUFFER,
        gl.COLOR_ATTACHMENT0,
        gl.TEXTURE_2D,
        tex2,
        0
      );

      let current = 0;
      let running = true;

      function render() {
        if (!running) return;

        const srcTex = current === 0 ? tex1 : tex2;
        const dstFb = current === 0 ? fb2 : fb1;

        gl.bindFramebuffer(gl.FRAMEBUFFER, dstFb);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.bindTexture(gl.TEXTURE_2D, srcTex);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        current = 1 - current;
        requestAnimationFrame(render);
        console.log("Render frame");
      }

      function toggle() {
        running = !running;
        if (running) requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    </script>
  </body>
</html>
